<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>t08 — Invite-based account registration</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        background: #101c30;
        color: #f5f4f1;
        line-height: 1.6;
      }
      h1 {
        font-size: 1.2rem;
      }
      .warn {
        border: 1px solid rgba(230, 178, 90, 0.6);
        background: rgba(230, 178, 90, 0.1);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.85rem;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-size: 0.85rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font-size: 0.9rem;
      }
      button {
        margin-top: 18px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid #e6b25a;
        background: rgba(230, 178, 90, 0.14);
        color: #f5f4f1;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 0.85rem;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <h1>초대 토큰으로 계정 등록</h1>
    <p class="warn">
      <code>npm run t08:create-invite -- &lt;username&gt; &lt;displayName&gt;</code>로
      만든 1회용 토큰이 있어야 합니다. 토큰은 주소창의 <code>#token=...</code>
      부분으로 전달하세요(서버 로그에 남지 않도록 쿼리스트링이 아닌 fragment
      사용). 이 페이지도 공개 소개 페이지에서 링크되지 않습니다.
    </p>

    <label for="deviceName">이 패스키 이름</label>
    <input type="text" id="deviceName" value="첫 패스키" maxlength="80" />

    <div>
      <button type="button" id="startBtn">패스키 등록 시작</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>

    <script src="js/vendor/simplewebauthn-browser.js"></script>
    <script>
      (function () {
        var swa = window.SimpleWebAuthnBrowser;
        var btn = document.getElementById('startBtn');
        var statusEl = document.getElementById('status');

        var token = (location.hash.match(/token=([^&]+)/) || [])[1];
        if (!token) {
          statusEl.textContent = '토큰이 없습니다. #token=... 형식의 링크로 열어주세요.';
          btn.disabled = true;
        }

        function post(url, body) {
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {}),
          }).then(function (res) {
            return res.json().then(function (json) {
              return { ok: res.ok, body: json };
            });
          });
        }

        btn.addEventListener('click', function () {
          statusEl.textContent = '진행 중...';
          btn.disabled = true;

          post('/api/t08/invite/register/options', { token: token })
            .then(function (optionsRes) {
              if (!optionsRes.ok) {
                throw { handled: true, message: '초대 토큰이 유효하지 않습니다: ' + optionsRes.body.error };
              }
              return swa.startRegistration({ optionsJSON: optionsRes.body });
            })
            .then(function (regResponse) {
              var deviceName = document.getElementById('deviceName').value || '첫 패스키';
              return post('/api/t08/invite/register/verify', {
                token: token,
                response: regResponse,
                deviceName: deviceName,
              });
            })
            .then(function (verifyRes) {
              if (!verifyRes.ok) {
                throw { handled: true, message: '등록 실패: ' + verifyRes.body.error };
              }
              statusEl.textContent = '등록 완료. 첫 화면의 PRIVATE ARCHIVE에서 방금 등록한 패스키로 로그인해보세요.';
              btn.disabled = true;
            })
            .catch(function (err) {
              statusEl.textContent = err && err.handled ? err.message : '오류: ' + (err && err.name ? err.name : err);
              btn.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
