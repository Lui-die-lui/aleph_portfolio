<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>t08 — Owner passkey bootstrap (local only)</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        background: #101c30;
        color: #f5f4f1;
        line-height: 1.6;
      }
      h1 {
        font-size: 1.2rem;
      }
      .warn {
        border: 1px solid rgba(230, 178, 90, 0.6);
        background: rgba(230, 178, 90, 0.1);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.85rem;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-size: 0.85rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font-size: 0.9rem;
      }
      button {
        margin-top: 18px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid #e6b25a;
        background: rgba(230, 178, 90, 0.14);
        color: #f5f4f1;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 0.85rem;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <h1>Owner 패스키 최초 등록</h1>
    <p class="warn">
      이 페이지는 <code>T08_BOOTSTRAP_ENABLED=true</code>인 로컬/제한된
      환경에서만 동작합니다. 등록이 끝나면 이 환경변수를 끄고(또는 배포
      환경에는 아예 설정하지 말고) 재배포하세요. 이 페이지는 공개
      소개 페이지 어디에서도 링크되지 않습니다.
    </p>

    <label for="displayName">표시 이름</label>
    <input type="text" id="displayName" value="Lee Seul gi" maxlength="80" />

    <div>
      <button type="button" id="startBtn">패스키 등록 시작</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>

    <script src="js/vendor/simplewebauthn-browser.js"></script>
    <script>
      (function () {
        var swa = window.SimpleWebAuthnBrowser;
        var btn = document.getElementById('startBtn');
        var statusEl = document.getElementById('status');

        function post(url, body) {
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {}),
          }).then(function (res) {
            return res.json().then(function (json) {
              return { ok: res.ok, body: json };
            });
          });
        }

        btn.addEventListener('click', function () {
          statusEl.textContent = '진행 중...';
          btn.disabled = true;

          var displayName = document.getElementById('displayName').value || 'Owner';

          post('/api/t08/bootstrap/register/options', { displayName: displayName })
            .then(function (optionsRes) {
              if (!optionsRes.ok) {
                throw { handled: true, message: 'Bootstrap을 시작할 수 없습니다: ' + optionsRes.body.error };
              }
              return swa.startRegistration({ optionsJSON: optionsRes.body });
            })
            .then(function (regResponse) {
              return post('/api/t08/bootstrap/register/verify', {
                response: regResponse,
                deviceName: '최초 등록 기기',
              });
            })
            .then(function (verifyRes) {
              if (!verifyRes.ok) {
                throw { handled: true, message: '등록 실패: ' + verifyRes.body.error };
              }
              statusEl.textContent =
                '등록 완료. 이제 .env에서 T08_BOOTSTRAP_ENABLED를 끄고, 배포 환경(Vercel)에는 ' +
                '이 값을 절대 설정하지 마세요. 첫 화면의 PRIVATE ARCHIVE에서 방금 등록한 패스키로 로그인해보세요.';
            })
            .catch(function (err) {
              statusEl.textContent = err && err.handled ? err.message : '오류: ' + (err && err.name ? err.name : err);
            })
            .finally(function () {
              btn.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
